  for (const [no, field, topic] of RAW) {
    if (field) currentField = field;
    out.push({ no, field: currentField, topic });
  }
  return out;
})();

const STORAGE_PREFIX = "checkitem:";

function understandingColor(v) {
  if (v >= 80) return GREEN;
  if (v >= 50) return "#4a7d9e";
  if (v >= 20) return GOLD;
  if (v > 0) return RED;
  return FADE;
}

function defaultState(no) {
  return { no, studyDate: "", understanding: 0, reviews: Array(REVIEW_COUNT).fill("") };
}

function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

// ---- localStorage helpers --------------------------------------------------
function loadAllFromLocalStorage() {
  const loaded = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(STORAGE_PREFIX)) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        loaded[parsed.no] = parsed;
      } catch (e) { /* skip corrupt entry */ }
    }
  }
  return loaded;
}

function saveToLocalStorage(item) {
  localStorage.setItem(`${STORAGE_PREFIX}${item.no}`, JSON.stringify(item));
}

// ---- Google Drive helpers (drive.file scope: only files this app creates) -
let gTokenClient = null;
let gAccessToken = null;
let gTokenExpiry = 0;

function ensureTokenClient(onToken) {
  if (!window.google || !window.google.accounts) {
    throw new Error("Googleライブラリの読み込みに失敗しました。通信環境を確認してください。");
  }
  if (!gTokenClient) {
    gTokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp) => {
        if (resp && resp.access_token) {
          gAccessToken = resp.access_token;
          gTokenExpiry = Date.now() + (Number(resp.expires_in) || 3500) * 1000;
          onToken(resp.access_token);
        }
      },
    });
  }
  return gTokenClient;
}

function getDriveToken() {
  return new Promise((resolve, reject) => {
    if (gAccessToken && Date.now() < gTokenExpiry - 30000) {
      resolve(gAccessToken);
      return;
    }
    try {
      const client = ensureTokenClient((token) => resolve(token));
      client.requestAccessToken({ prompt: gAccessToken ? "" : "consent" });
    } catch (e) {
      reject(e);
    }
  });
}

async function driveFindFile(token) {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error(`Drive検索エラー: ${res.status}`);
  const data = await res.json();
  return data.files && data.files[0] ? data.files[0] : null;
}

async function driveUpload(token, fileId, content) {
  const metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
  const boundary = "-------pdca-boundary-" + Date.now();
  const body =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(fileId ? {} : metadata) +
    `\r\n--${boundary}\r\n` +
    `Content-Type: application/json\r\n\r\n` +
    content +
    `\r\n--${boundary}--`;

  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

  const res = await fetch(url, {
    method: fileId ? "PATCH" : "POST",
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": `multipart/related; boundary=${boundary}`,
    },
    body,
  });
  if (!res.ok) throw new Error(`Drive保存エラー: ${res.status}`);
  return res.json();
}

async function driveDownload(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error(`Drive読み込みエラー: ${res.status}`);
  return res.text();
}


function StudyChecklist() {
  const [state, setState] = useState(() => loadAllFromLocalStorage());
  const [search, setSearch] = useState("");
  const [fieldFilter, setFieldFilter] = useState("");
  const [showOnly, setShowOnly] = useState("all");
  const [understandingMin, setUnderstandingMin] = useState("");
  const [understandingMax, setUnderstandingMax] = useState("");
  const [collapsed, setCollapsed] = useState({});
  const [toast, setToast] = useState("");
  const [driveState, setDriveState] = useState("idle"); // idle | saving | loading | error
  const fileInputRef = useRef(null);

  const getItem = useCallback((no) => state[no] || defaultState(no), [state]);

  const updateItem = useCallback((no, patch) => {
    setState((prev) => {
      const current = prev[no] || defaultState(no);
      const next = { ...current, ...patch };
      saveToLocalStorage(next);
      return { ...prev, [no]: next };
    });
  }, []);

  const setReviewDate = (no, idx, value) => {
    const item = getItem(no);
    const reviews = [...item.reviews];
    reviews[idx] = value;
    updateItem(no, { reviews });
  };

  const setStudyToday = (no) => {
    const item = getItem(no);
    updateItem(no, { studyDate: item.studyDate ? "" : todayISO() });
  };

  const filtered = useMemo(() => {
    return ITEMS.filter((it) => {
      if (fieldFilter && it.field !== fieldFilter) return false;
      if (search && !(it.topic.includes(search) || it.field.includes(search))) return false;
      const s = getItem(it.no);
      if (showOnly === "unstudied" && s.studyDate) return false;
      if (showOnly === "needsReview") {
        const reviewedCount = s.reviews.filter(Boolean).length;
        if (!s.studyDate || reviewedCount >= REVIEW_COUNT) return false;
      }
      if (understandingMin !== "" && Number(s.understanding) < Number(understandingMin)) return false;
      if (understandingMax !== "" && Number(s.understanding) > Number(understandingMax)) return false;
      return true;
    });
  }, [search, fieldFilter, showOnly, understandingMin, understandingMax, state]);

  const grouped = useMemo(() => {
    const g = {};
    for (const it of filtered) {
      if (!g[it.field]) g[it.field] = [];
      g[it.field].push(it);
    }
    return g;
  }, [filtered]);

  const stats = useMemo(() => {
    const total = ITEMS.length;
    let studied = 0, understandSum = 0, reviewDone = 0;
    for (const it of ITEMS) {
      const s = getItem(it.no);
      if (s.studyDate) studied++;
      understandSum += Number(s.understanding) || 0;
      reviewDone += s.reviews.filter(Boolean).length;
    }
    return {
      total, studied,
      studiedPct: Math.round((studied / total) * 100),
      avgUnderstanding: Math.round(understandSum / total),
      reviewPct: Math.round((reviewDone / (total * REVIEW_COUNT)) * 100),
    };
  }, [state]);

  const toggleCollapse = (field) => setCollapsed((c) => ({ ...c, [field]: !c[field] }));

  const flashToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2500);
  };

  // ---- backup: export / import as JSON file --------------------------------
  const exportJSON = () => {
    const payload = { exportedAt: new Date().toISOString(), data: state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `資格学習チェックリスト_${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    flashToast("バックアップファイルを書き出しました");
  };

  const importJSON = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const data = parsed.data || parsed;
        Object.values(data).forEach((item) => saveToLocalStorage(item));
        setState(loadAllFromLocalStorage());
        flashToast("バックアップから復元しました");
      } catch (err) {
        flashToast("読み込みに失敗しました。ファイルを確認してください");
      }
    };
    reader.readAsText(file);
  };

  // ---- Google Drive save / load ---------------------------------------------
  const saveToDrive = async () => {
    if (GOOGLE_CLIENT_ID.startsWith("YOUR_")) {
      flashToast("先にGoogleのクライアントIDを設定してください");
      return;
    }
    setDriveState("saving");
    try {
      const token = await getDriveToken();
      let fileId = localStorage.getItem("driveFileId");
      if (!fileId) {
        const found = await driveFindFile(token);
        if (found) fileId = found.id;
      }
      const payload = JSON.stringify({ exportedAt: new Date().toISOString(), data: state }, null, 2);
      const result = await driveUpload(token, fileId, payload);
      if (result && result.id) localStorage.setItem("driveFileId", result.id);
      setDriveState("idle");
      flashToast("Googleドライブに保存しました");
    } catch (e) {
      console.error(e);
      setDriveState("error");
      flashToast("Googleドライブへの保存に失敗しました");
      setTimeout(() => setDriveState("idle"), 2000);
    }
  };

  const loadFromDrive = async () => {
    if (GOOGLE_CLIENT_ID.startsWith("YOUR_")) {
      flashToast("先にGoogleのクライアントIDを設定してください");
      return;
    }
    setDriveState("loading");
    try {
      const token = await getDriveToken();
      let fileId = localStorage.getItem("driveFileId");
      if (!fileId) {
        const found = await driveFindFile(token);
        if (found) fileId = found.id;
      }
      if (!fileId) {
        setDriveState("idle");
        flashToast("Googleドライブにまだ保存データがありません");
        return;
      }
      const text = await driveDownload(token, fileId);
      const parsed = JSON.parse(text);
      const data = parsed.data || parsed;
      Object.values(data).forEach((item) => saveToLocalStorage(item));
      localStorage.setItem("driveFileId", fileId);
      setState(loadAllFromLocalStorage());
      setDriveState("idle");
      flashToast("Googleドライブから読み込みました");
    } catch (e) {
      console.error(e);
      setDriveState("error");
      flashToast("Googleドライブからの読み込みに失敗しました");
      setTimeout(() => setDriveState("idle"), 2000);
    }
  };

  return (
    <div style={{ minHeight: "100vh", width: "100%", overflowX: "hidden", background: PAPER, fontFamily: FONT_BODY, color: INK }}>
      <div style={{ maxWidth: 980, width: "100%", margin: "0 auto", padding: "32px 20px 80px", overflowX: "hidden" }}>
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.18em", color: FADE, marginBottom: 6 }}>
            STUDY CHECKLIST — {ITEMS.length} ITEMS · LOCAL
          </div>
          <h1 style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 30, margin: 0, color: INK }}>学習項目管理表</h1>
          <div style={{ fontSize: 13, color: FADE, marginTop: 6 }}>
            この端末のブラウザに保存されます（ログイン不要）。
          </div>
        </div>

        {/* Stats */}
        <div className="stat-grid" style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 1, background: PAPER_LINE, border: `1px solid ${PAPER_LINE}`, borderRadius: 4, overflow: "hidden", marginBottom: 24 }}>
          <StatBox label="学習項目数" value={stats.total} unit="項目" />
          <StatBox label="学習済み" value={`${stats.studied}/${stats.total}`} unit={`(${stats.studiedPct}%)`} color={GREEN} />
          <StatBox label="平均理解度" value={`${stats.avgUnderstanding}`} unit="%" color={GOLD} />
          <StatBox label="復習達成率" value={`${stats.reviewPct}%`} unit="全5回中" color={RED} />
        </div>

        {/* Controls */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <input
            type="text" placeholder="項目名・分野で検索…" value={search}
            onChange={(e) => setSearch(e.target.value)}
            style={{ flex: "1 1 220px", padding: "8px 12px", fontSize: 13, border: `1px solid ${PAPER_LINE}`, borderRadius: 4, background: "#fffdf7", color: INK }}
          />
          <select value={fieldFilter} onChange={(e) => setFieldFilter(e.target.value)}
            style={{ padding: "8px 10px", fontSize: 13, border: `1px solid ${PAPER_LINE}`, borderRadius: 4, background: "#fffdf7", color: INK }}>
            <option value="">すべての分野</option>
            {FIELDS.map((f) => <option key={f} value={f}>{f}</option>)}
          </select>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 12, color: FADE, fontFamily: FONT_MONO }}>理解度</span>
            <input type="number" min={0} max={100} step={5} placeholder="0" value={understandingMin}
              onChange={(e) => setUnderstandingMin(e.target.value)}
              style={{ width: 54, padding: "7px 8px", fontSize: 12.5, fontFamily: FONT_MONO, border: `1px solid ${PAPER_LINE}`, borderRadius: 4, background: "#fffdf7", color: INK }} />
            <span style={{ fontSize: 12, color: FADE }}>〜</span>
            <input type="number" min={0} max={100} step={5} placeholder="100" value={understandingMax}
              onChange={(e) => setUnderstandingMax(e.target.value)}
              style={{ width: 54, padding: "7px 8px", fontSize: 12.5, fontFamily: FONT_MONO, border: `1px solid ${PAPER_LINE}`, borderRadius: 4, background: "#fffdf7", color: INK }} />
            <span style={{ fontSize: 12, color: FADE }}>%</span>
            {(understandingMin !== "" || understandingMax !== "") && (
              <button onClick={() => { setUnderstandingMin(""); setUnderstandingMax(""); }} className="pdca-btn"
                style={{ fontSize: 11, color: RED, background: "transparent", border: `1px solid ${RED}55`, borderRadius: 4, padding: "5px 8px" }}>
                クリア
              </button>
            )}
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {[["all", "すべて"], ["unstudied", "未学習のみ"], ["needsReview", "復習未完了"]].map(([v, label]) => (
              <button key={v} onClick={() => setShowOnly(v)} className="pdca-btn"
                style={{ padding: "7px 14px", fontSize: 12.5, borderRadius: 4, border: `1px solid ${showOnly === v ? INK : PAPER_LINE}`, background: showOnly === v ? INK : "transparent", color: showOnly === v ? PAPER : INK }}>
                {label}
              </button>
            ))}
          </div>
        </div>

        {/* Legend */}
        <div style={{ display: "flex", gap: 16, alignItems: "center", marginBottom: 18, fontSize: 11.5, color: FADE, fontFamily: FONT_MONO, flexWrap: "wrap" }}>
          <span>理解度: 0〜100の数字で入力（色は自動）</span>
          <span>復習: ①〜⑤に復習した日付を入力</span>
        </div>

        {/* Item list */}
        <div style={{ border: `1px solid ${PAPER_LINE}`, borderRadius: 4, overflow: "hidden" }}>
          {FIELDS.filter((f) => grouped[f]?.length).map((field) => (
            <div key={field}>
              <div className="field-header" onClick={() => toggleCollapse(field)}
                style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: "#efe6cf", borderTop: `1px solid ${PAPER_LINE}`, borderBottom: `1px solid ${PAPER_LINE}` }}>
                <span style={{ fontSize: 11, color: FADE, width: 12 }}>{collapsed[field] ? "▸" : "▾"}</span>
                <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 14.5, color: INK }}>{field}</span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: FADE }}>({grouped[field].length}項目)</span>
              </div>

              {!collapsed[field] && grouped[field].map((it) => {
                const s = getItem(it.no);
                return (
                  <div key={it.no} className="item-row" style={{ padding: "10px 12px", borderBottom: `1px solid ${PAPER_LINE}55` }}>
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
                      <div style={{ display: "flex", gap: 8, minWidth: 0 }}>
                        <span style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: FADE, flexShrink: 0, paddingTop: 1 }}>
                          {String(it.no).padStart(3, "0")}
                        </span>
                        <span style={{ fontSize: 13, color: INK, lineHeight: 1.35, wordBreak: "break-word" }}>{it.topic}</span>
                      </div>
                      <button onClick={() => setStudyToday(it.no)} className="pdca-btn"
                        style={{ flexShrink: 0, fontFamily: FONT_MONO, fontSize: 10.5, padding: "3px 7px", borderRadius: 3, border: `1px solid ${s.studyDate ? GREEN : PAPER_LINE}`, background: s.studyDate ? `${GREEN}18` : "transparent", color: s.studyDate ? GREEN : FADE, whiteSpace: "nowrap" }}
                        title="クリックで学習日を今日に設定/解除">
                        {s.studyDate || "未学習"}
                      </button>
                    </div>

                    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <span style={{ fontSize: 10, color: FADE, fontFamily: FONT_MONO }}>理解度</span>
                        <input type="number" min={0} max={100} step={5} value={s.understanding}
                          onChange={(e) => {
                            let v = Number(e.target.value);
                            if (Number.isNaN(v)) v = 0;
                            v = Math.max(0, Math.min(100, v));
                            updateItem(it.no, { understanding: v });
                          }}
                          style={{ width: 48, fontFamily: FONT_MONO, fontSize: 12.5, fontWeight: 700, textAlign: "right", color: understandingColor(s.understanding), border: `1.5px solid ${understandingColor(s.understanding)}66`, borderRadius: 3, padding: "3px 5px", background: "#fffdf7" }} />
                        <span style={{ fontSize: 10.5, color: FADE }}>%</span>
                      </div>

                      <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                        {s.reviews.map((dateVal, idx) => (
                          <div key={idx} style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                            <span style={{ fontSize: 8.5, color: FADE, fontFamily: FONT_MONO, marginBottom: 1 }}>{idx + 1}</span>
                            <input type="date" value={dateVal} onChange={(e) => setReviewDate(it.no, idx, e.target.value)}
                              style={{ width: 62, fontFamily: FONT_MONO, fontSize: 9.5, padding: "2px 2px", borderRadius: 3, border: `1.5px solid ${dateVal ? RED : PAPER_LINE}`, background: dateVal ? `${RED}12` : "#fffdf7", color: dateVal ? RED : FADE }} />
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
          {filtered.length === 0 && (
            <div style={{ padding: 24, textAlign: "center", color: FADE, fontSize: 13 }}>該当する項目がありません。</div>
          )}
        </div>

        {/* Backup */}
        <div style={{ marginTop: 26, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <button onClick={saveToDrive} disabled={driveState === "saving"} className="pdca-btn"
            style={{ background: "transparent", color: driveState === "saving" ? FADE : RED, border: `1.5px solid ${driveState === "saving" ? FADE : RED}`, borderRadius: 4, padding: "9px 18px", fontSize: 13, fontWeight: 600 }}>
            {driveState === "saving" ? "Googleドライブに保存中…" : "Googleドライブに保存"}
          </button>
          <button onClick={loadFromDrive} disabled={driveState === "loading"} className="pdca-btn"
            style={{ background: "transparent", color: driveState === "loading" ? FADE : RED, border: `1.5px solid ${driveState === "loading" ? FADE : RED}`, borderRadius: 4, padding: "9px 18px", fontSize: 13, fontWeight: 600 }}>
            {driveState === "loading" ? "読み込み中…" : "Googleドライブから読み込む"}
          </button>
          <span style={{ width: 1, height: 22, background: PAPER_LINE }} />
          <button onClick={exportJSON} className="pdca-btn"
            style={{ background: INK, color: PAPER, border: "none", borderRadius: 4, padding: "9px 18px", fontSize: 13, fontWeight: 600 }}>
            バックアップを書き出す
          </button>
          <button onClick={() => fileInputRef.current.click()} className="pdca-btn"
            style={{ background: "transparent", color: INK, border: `1.5px solid ${INK}`, borderRadius: 4, padding: "9px 18px", fontSize: 13, fontWeight: 600 }}>
            バックアップから復元
          </button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }}
            onChange={(e) => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; }} />
          {toast && <span style={{ fontSize: 12.5, color: GREEN, fontFamily: FONT_MONO }}>{toast}</span>}
        </div>
        <div style={{ marginTop: 8, fontSize: 11.5, color: FADE }}>
          データはこの端末のブラウザに保存されます。「Googleドライブに保存」を使うと、ご自身のGoogleアカウントのドライブにもバックアップできます（初回はGoogleのログイン・許可画面が表示されます）。
        </div>
      </div>
    </div>
  );
}

function StatBox({ label, value, unit, color = INK }) {
  return (
    <div style={{ background: "#fffdf7", padding: "14px 16px" }}>
      <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: FADE, letterSpacing: "0.05em", marginBottom: 4 }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 22, color }}>{value}</span>
        <span style={{ fontSize: 11, color: FADE }}>{unit}</span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StudyChecklist />);
</script>
</body>
</html>
